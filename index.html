<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Science Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Shared gradients. Not display:none, or Chrome drops them. -->
  <svg id="global-defs" width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#BFE6FF"/><stop offset="1" stop-color="#EAF8FF"/>
      </linearGradient>
      <linearGradient id="g-soil" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8A5A34"/><stop offset="1" stop-color="#5A3620"/>
      </linearGradient>
      <linearGradient id="g-darksoil" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4A3426"/><stop offset="1" stop-color="#2A1D15"/>
      </linearGradient>
      <linearGradient id="g-grass" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8BD17C"/><stop offset="1" stop-color="#5BAA4E"/>
      </linearGradient>
      <linearGradient id="g-pot" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#C8612F"/><stop offset=".45" stop-color="#E4834A"/><stop offset="1" stop-color="#B5532A"/>
      </linearGradient>
      <linearGradient id="g-glass" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".3" stop-color="#ffffff" stop-opacity=".15"/><stop offset="1" stop-color="#ffffff" stop-opacity=".4"/>
      </linearGradient>
      <linearGradient id="g-bark" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#5B3A22"/><stop offset=".5" stop-color="#8A5C3A"/><stop offset="1" stop-color="#4D301C"/>
      </linearGradient>
      <radialGradient id="g-sun" cx=".45" cy=".4" r=".6">
        <stop offset="0" stop-color="#FFF6B0"/><stop offset=".6" stop-color="#FFD43B"/><stop offset="1" stop-color="#FFB300"/>
      </radialGradient>
      <radialGradient id="g-glow" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#FFF3A0" stop-opacity=".9"/><stop offset="1" stop-color="#FFF3A0" stop-opacity="0"/>
      </radialGradient>
      <filter id="f-soft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".18"/>
      </filter>
    </defs>
  </svg>

  <!-- Start screen and lesson picker. Picking a lesson also unlocks sound and speech. -->
  <div id="splash">
    <div class="splash-scene" id="splash-scene"></div>
    <div class="splash-card">
      <div class="splash-topic">Science</div>
      <h1>Science Explorer</h1>
      <p>Choose a lesson. Shelly the tortoise will read it to you, so turn your sound on!</p>
      <label class="name-field">
        <span>What's your name?</span>
        <input id="learner-name" maxlength="20" placeholder="Type your name" autocomplete="off">
      </label>
      <div class="lesson-grid" id="lesson-grid"></div>
    </div>
  </div>
  <div id="app" hidden>
    <header class="topbar">
      <button class="home-btn" id="btn-home" title="All lessons">🏠</button>
      <div class="brand"><span class="brand-num" id="brand-num"></span><span class="brand-title" id="brand-title"></span></div>
      <div class="overall">
        <div class="overall-bar"><div id="overall-fill"></div></div>
        <span id="overall-text">0%</span>
      </div>
      <div class="settings">
        <button class="tgl" id="tgl-sound" title="Sound effects">🔔 <span>Sounds</span></button>
        <button class="tgl" id="tgl-voice" title="Read aloud">🗣️ <span>Voice</span></button>
        <button class="tgl" id="tgl-auto" title="Read each page automatically">▶️ <span>Auto-read</span></button>
        <button class="tgl" id="tgl-nature" title="Garden sounds">🐦 <span>Garden</span></button>
        <select id="sel-rate" title="Reading speed">
          <option value="0.8">🐢 Slow</option>
          <option value="0.95" selected>🙂 Normal</option>
          <option value="1.1">🐇 Fast</option>
        </select>
      </div>
    </header>

    <nav id="sidebar" aria-label="Chapters"></nav>

    <main id="main">
      <div class="banner">
        <span class="banner-icon" id="banner-icon"></span>
        <h1 id="banner-title"></h1>
        <div class="dots" id="step-dots"></div>
      </div>
      <section class="content">
        <div class="stage-wrap">
          <div id="stage"></div>
          <div id="feedback" role="status"></div>
          <div id="controls"></div>
        </div>
        <aside class="talk">
          <div id="cards"></div>
          <div class="keywords" id="keywords"></div>
        </aside>
      </section>
      <footer class="stepnav">
        <button class="btn nav" id="btn-back">◀ Back</button>
        <button class="btn read" id="btn-read">🔊 Read to me</button>
        <button class="btn nav primary" id="btn-next">Next ▶</button>
      </footer>
    </main>
  </div>

  <canvas id="fx"></canvas>

  <script src="js/core/audio.js"></script>
  <script src="js/core/speech.js"></script>
  <script src="js/core/svg.js"></script>
  <script src="js/core/widgets.js"></script>
  <script src="js/core/app.js"></script>
  <!-- Lesson list. Each lesson's chapter files load when it is opened. -->
  <script src="lessons/lessons.js"></script>
  <script>App.boot();</script>
</body>
</html>
